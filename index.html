<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFA Dubai — App Onboarding Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#00A651;
    --mint-bright:#1fd97a;
    --navy:#13181E;
    --charcoal:#282E34;
    --void:#0D1117;
    --line:rgba(0,166,81,0.25);
    --text:#EDEFF2;
    --text-dim:#8A94A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0,166,81,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(0,166,81,0.07), transparent 60%),
      var(--void);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .app{
    width:100%;
    max-width:560px;
  }

  /* ---------- HEADER ---------- */
  .masthead{
    text-align:center;
    margin-bottom:22px;
  }
  .brand-logo{
    height:34px;
    width:auto;
    margin-bottom:14px;
    filter:drop-shadow(0 0 10px rgba(0,166,81,0.25));
  }
  h1.title{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(32px,8vw,44px);
    letter-spacing:1px;
    margin:0;
    line-height:1;
    color:#fff;
  }
  h1.title span{color:var(--mint);}
  .subtitle{
    font-size:13px;
    color:var(--text-dim);
    margin-top:6px;
    letter-spacing:0.3px;
  }

  /* ---------- TRACK SELECT ---------- */
  .track-select{
    display:flex;
    gap:10px;
    background:var(--charcoal);
    padding:6px;
    border-radius:14px;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.05);
  }
  .track-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:'Bebas Neue',sans-serif;
    font-size:17px;
    letter-spacing:1.5px;
    padding:12px 8px;
    border-radius:10px;
    cursor:pointer;
    transition:background 0.25s, color 0.25s;
  }
  .track-btn.active{
    background:var(--mint);
    color:#04220f;
    box-shadow:0 4px 18px rgba(0,166,81,0.35);
  }
  .track-btn:focus-visible{outline:2px solid #fff; outline-offset:2px;}

  /* ---------- SCOREBOARD / PROGRESS ---------- */
  .scoreboard{
    background:linear-gradient(180deg, #1a2029, #12161c);
    border:1px solid rgba(0,166,81,0.2);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .scoreboard-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .scoreboard-label{
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .scoreboard-count{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;
    letter-spacing:1px;
    color:var(--mint-bright);
    text-shadow:0 0 10px rgba(31,217,122,0.5);
    font-variant-numeric:tabular-nums;
  }
  .pitch-track{
    position:relative;
    height:6px;
    background:rgba(255,255,255,0.08);
    border-radius:4px;
    overflow:hidden;
  }
  .pitch-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    background:linear-gradient(90deg, var(--mint), var(--mint-bright));
    border-radius:4px;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 10px rgba(0,166,81,0.6);
  }
  .step-dots{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
  }
  .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    transition:background 0.3s, transform 0.3s;
  }
  .dot.done{background:var(--mint);}
  .dot.current{background:var(--mint-bright); transform:scale(1.4); box-shadow:0 0 8px rgba(31,217,122,0.8);}

  /* ---------- STEP CARD ---------- */
  .card{
    background:var(--charcoal);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    padding:26px 22px 22px;
    margin-bottom:16px;
    animation:fadeIn 0.35s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card-eyebrow{
    font-size:11px;
    letter-spacing:2px;
    color:var(--mint);
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:6px;
  }
  .card-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    letter-spacing:0.5px;
    color:#fff;
    margin:0 0 16px;
    line-height:1.1;
  }
  .checklist{
    list-style:none;
    margin:0;padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .check-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    transition:background 0.2s, border-color 0.2s;
  }
  .check-item:hover{background:rgba(0,166,81,0.06); border-color:rgba(0,166,81,0.25);}
  .check-item.checked{background:rgba(0,166,81,0.1); border-color:rgba(0,166,81,0.35);}
  .checkbox{
    width:20px;height:20px;
    border-radius:6px;
    border:2px solid var(--text-dim);
    flex-shrink:0;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    transition:background 0.2s, border-color 0.2s;
  }
  .check-item.checked .checkbox{
    background:var(--mint);
    border-color:var(--mint);
  }
  .checkbox svg{
    width:12px;height:12px;
    opacity:0;
    transition:opacity 0.15s;
  }
  .check-item.checked .checkbox svg{opacity:1;}
  .check-text{
    font-size:14.5px;
    line-height:1.45;
    color:var(--text);
  }
  .check-item.checked .check-text{color:var(--text-dim); text-decoration:line-through; text-decoration-color:rgba(138,148,160,0.5);}
  .check-text b{color:#fff; font-weight:700;}
  .check-item.checked .check-text b{color:var(--text-dim);}

  .note{
    margin-top:16px;
    padding:12px 14px;
    border-radius:10px;
    background:rgba(255,90,90,0.08);
    border:1px solid rgba(255,90,90,0.25);
    font-size:13px;
    color:#ffb3b3;
    line-height:1.5;
  }
  .note.mint{
    background:rgba(0,166,81,0.08);
    border-color:rgba(0,166,81,0.3);
    color:#8fe0b5;
  }

  /* Rules table card */
  .rule-grid{display:flex; flex-direction:column; gap:10px;}
  .rule-row{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:10px;
    padding:12px 14px;
  }
  .rule-row .k{
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--mint);
    font-weight:700;
    margin-bottom:4px;
  }
  .rule-row .v{font-size:13.5px; color:var(--text); line-height:1.5;}

  /* ---------- NAV ---------- */
  .nav{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:none;
    font-family:'Bebas Neue',sans-serif;
    font-size:16px;
    letter-spacing:1.5px;
    cursor:pointer;
    transition:transform 0.15s, opacity 0.15s, background 0.15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .btn-primary{
    background:var(--mint);
    color:#04220f;
    box-shadow:0 4px 18px rgba(0,166,81,0.3);
  }
  .btn-primary:hover{background:var(--mint-bright);}
  .btn-ghost{
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.15);
    color:var(--text-dim);
  }
  .btn-ghost:hover{border-color:rgba(255,255,255,0.3); color:var(--text);}
  .btn[disabled]{opacity:0.35; cursor:not-allowed;}

  /* ---------- COMPLETE STATE ---------- */
  .complete-card{
    text-align:center;
    padding:40px 24px;
  }
  .whistle{
    width:64px;height:64px;
    margin:0 auto 18px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,166,81,0.25), transparent 70%);
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--mint);
    box-shadow:0 0 24px rgba(0,166,81,0.4);
  }
  .whistle::after{content:'✓'; color:var(--mint-bright); font-size:28px; font-weight:800;}
  .complete-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px;
    color:#fff;
    letter-spacing:1px;
    margin-bottom:8px;
  }
  .complete-sub{color:var(--text-dim); font-size:14px; line-height:1.6; margin-bottom:20px;}

  footer{
    text-align:center;
    margin-top:24px;
    font-size:11.5px;
    color:var(--text-dim);
    letter-spacing:0.3px;
  }
  footer a{color:var(--mint); text-decoration:none;}
</style>
</head>

let track = 'player';
let idx = 0;
let checks = {}; // "player-0-1": true

function key(t,s,i){ return t+'-'+s+'-'+i; }

function setTrack(t){
  track = t;
  idx = 0;
  document.getElementById('btn-player').classList.toggle('active', t==='player');
  document.getElementById('btn-manager').classList.toggle('active', t==='manager');
  document.getElementById('phase-label').textContent = DATA[t].label;
  render();
}

function toggleCheck(i){
  const k = key(track, idx, i);
  checks[k] = !checks[k];
  render();
}

function renderDots(total){
  const wrap = document.getElementById('step-dots');
  wrap.innerHTML = '';
  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i<idx?' done':'') + (i===idx?' current':'');
    wrap.appendChild(d);
  }
}

        <h2 class="card-title">${step.title}</h2>
        <ul class="checklist" id="checklist"></ul>
        ${step.note ? `<div class="note ${step.note.type==='mint'?'mint':''}">${step.note.text}</div>` : ''}
      </div>
    `;
    const ul = document.getElementById('checklist');
    step.items.forEach((text,i)=>{
      const li = document.createElement('li');
      const isChecked = !!checks[key(track,idx,i)];
      li.className = 'check-item' + (isChecked?' checked':'');
      li.onclick = ()=>toggleCheck(i);
      li.innerHTML = `
        <div class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="#04220f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="check-text">${text}</div>
      `;
      ul.appendChild(li);
    });
  } else if(step.rules){
    slot.innerHTML = `
      <div class="card">
        <div class="card-eyebrow">${step.eyebrow}</div>
        <h2 class="card-title">${step.title}</h2>
        <div class="rule-grid">
          ${step.rules.map(r=>`
            <div class="rule-row">
              <div class="k">${r.k}</div>
              <div class="v">${r.v}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('btn-back').disabled = (idx===0);
  document.getElementById('btn-next').textContent = (idx===total-1) ? 'Finish' : 'Next';
}

function goNext(){
  const total = DATA[track].steps.length;
  if(idx < total-1){
    idx++;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    showComplete();
  }
}

function goBack(){
  if(idx>0){
    idx--;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function showComplete(){
  document.getElementById('card-slot').innerHTML = `
    <div class="card complete-card">
      <div class="whistle"></div>
      <div class="complete-title">Kickoff Ready.</div>
      <div class="complete-sub">You've completed the ${track==='player'?'player':'manager'} onboarding walkthrough.<br>Welcome to EFA Dubai — see you on the pitch.</div>
    </div>
  `;
  document.getElementById('btn-next').textContent = 'Restart';
  document.getElementById('btn-next').onclick = ()=>{ idx=0; document.getElementById('btn-next').onclick=goNext; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  document.getElementById('btn-back').disabled = true;
}

render();
</script>
</body>
</html>
